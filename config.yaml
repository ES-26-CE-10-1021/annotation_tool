server:
  point_cloud_sampling_stride: 10 
  local_point_cloud_voxel_downsampling: 0.02 
  global_point_cloud_voxel_dowsampling: 0.03
  data_root: "/media/ai/T7/agco2026/"
  chunk_size: 200000
  annotation_file: "bboxes.json"
  coord_dir_name: "pointcloud_raw"
  lidar_types: ["lslidar","rslidar","ouster"]
  max_cache_size: 500
  max_azimuth_std: 2.3
  calibration_file: "backend/sensor_interface/visualization/calibration/march_12_calibration.yaml"
  save_segment: true
  load_colors: true
  save_colors: true

segmentation:
  use_normal_filter: true
  height_threshold: 0.1
  normal_threshold: 0.6 



frontend: 
  label_dict:
    background: 0
    tractor: 1
    harvester: 2
    trailer: 3
    car: 4
    hopper: 5
    # building: 6 
    # tree: 7






